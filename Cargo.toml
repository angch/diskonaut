[workspace]
members = ["libdiskonaut", "diskonaut"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Ang Chin Han <ang.chin.han@gmail.com>"]
homepage = "https://github.com/angch/diskonaut"
description = "Performance-focused, multi-platform fork of the diskonaut disk-usage navigator"
repository = "https://github.com/angch/diskonaut"
# Own 0.x line: this fork diverged from upstream diskonaut 0.13.0 and versions independently.
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
dua-core = "4"
libc = "0.2"
libdiskonaut = { path = "libdiskonaut" }
rustix = { version = "1", default-features = false, features = ["std", "process", "fs"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
unicode-width = "0.2"

[package]
name = "diskonaut-angch"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true

# The package is renamed for the fork, but the binary keeps the `diskonaut` name so the command,
# the docs, and the benchmark recipes are unchanged.
[[bin]]
name = "diskonaut"
path = "src/main.rs"

[features]
default = []

[dependencies]
clap = { workspace = true }
libdiskonaut = { workspace = true }
dua-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
ratatui = { workspace = true }
unicode-width = { workspace = true }
